services:
  db:
    image: postgres:16
    container_name: tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tracker
    # Host port 5434 avoids clashing with a locally installed Postgres on 5432.
    ports:
      - '5434:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tracker']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  pgdata:
